name: Generate Pacman Graph

on:
  workflow_dispatch:

permissions:
  contents: write   # 🔥 IMPORTANT FIX

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4   # updated

      - uses: Platane/snk@v3
        with:
          github_user_name: AdityaSirsalkar001
          outputs: |
            dist/pacman.svg

      - uses: crazy-max/ghaction-github-pages@v4   # updated
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
