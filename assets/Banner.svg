<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="300" viewBox="0 0 650 300">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#13141a"/>
    </linearGradient>
  </defs>
  
  <!-- Window -->
  <rect x="0" y="0" width="650" height="300" rx="12" fill="url(#termBg)" stroke="#2d2d3a"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="650" height="36" rx="12" fill="#1e1f29"/>
  <rect x="0" y="24" width="650" height="12" fill="#1e1f29"/>
  
  <!-- Controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="325" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#6b7280">
    aditya@workspace — terminal
  </text>
  
  <g font-family="monospace" font-size="13">
    
    <!-- Command -->
    <text x="20" y="65" fill="#27ca40">❯</text>
    <text x="40" y="65" fill="#e5e7eb">cat profile.json</text>
    
    <!-- JSON -->
    <text x="20" y="95" fill="#fbbf24">{</text>
    
    <!-- name -->
    <text x="35" y="120" fill="#a78bfa">"name"</text>
    <text x="100" y="120" fill="#9ca3af">:</text>
    <text x="110" y="120" fill="#34d399">"Aditya Sirsalkar"</text>
    
    <!-- status -->
    <text x="35" y="140" fill="#a78bfa">"status"</text>
    <text x="100" y="140" fill="#9ca3af">:</text>
    <text x="110" y="140" fill="#34d399">"B.Tech IT Undergrad &amp; Developer"</text>
    
    <!-- email -->
    <text x="35" y="160" fill="#a78bfa">"email"</text>
    <text x="100" y="160" fill="#9ca3af">:</text>
    <text x="110" y="160" fill="#34d399">"adityasirsalkar33@gmail.com"</text>
    
    <!-- focus -->
    <text x="35" y="180" fill="#a78bfa">"focus"</text>
    <text x="100" y="180" fill="#9ca3af">:</text>
    <text x="110" y="180" fill="#34d399">"CP &amp; Web Development"</text>
    
    <!-- goal -->
    <text x="35" y="200" fill="#a78bfa">"goal"</text>
    <text x="100" y="200" fill="#9ca3af">:</text>
    <text x="110" y="200" fill="#34d399">"Build Scalable Systems"</text>
    
    <text x="20" y="230" fill="#fbbf24">}</text>
    
    <!-- cursor -->
    <text x="20" y="260" fill="#27ca40">❯</text>
    <rect x="40" y="248" width="10" height="14" fill="#667eea">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    
  </g>
</svg>
